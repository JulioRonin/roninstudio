  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-size:13px; color:#9A958A;\">© 2026 Vértice — Ronin Studio · Ciudad Juárez, Chihuahua, México<\u002Fspan>\n    <span style=\"font-size:13px; color:#9A958A;\">Hecho con ♥ para las escuelas de México<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:980}}\">\nclass Component extends DCLogic {\n  state = { scrolled: false, activeModule: 0, openFaq: 0 };\n\n  get MODULES() {\n    const p = (d) => React.createElement('path', { key: d, d });\n    return [\n      { name: 'Alumnos', tag: 'Expediente digital', title: 'El expediente completo de cada alumno', desc: 'CURP, historial médico, documentos y tutores en un solo lugar seguro y siempre a la mano.', points: ['Ficha completa: datos, médico y documentos', 'Búsqueda instantánea de cualquier alumno', 'Aislado y seguro por escuela'], mockLabel: '412 activos', mockRows: [['Sofía Herrera · 3º A', 'Al día'], ['Diego Ramos · 5º B', 'Al día'], ['Valeria Cruz · 1º C', 'Pendiente']] },\n      { name: 'Colegiaturas', tag: 'Pagos en línea', title: 'Colegiaturas claras para cada familia', desc: 'Los papás ven exactamente cuánto deben, qué pagaron y cuándo vence. Cobra por Stripe, MercadoPago o referencia.', points: ['Estado de cuenta en tiempo real por familia', 'Recordatorios automáticos antes del vencimiento', 'Conciliación sin hojas de Excel'], mockLabel: '92% al día', mockRows: [['Familia Ríos · Enero', '$4,200'], ['Familia Soto · Enero', '$3,800'], ['Familia Vega · Enero', 'Vence 3d']] },\n      { name: 'Comunicados', tag: 'Comunicación', title: 'Un solo canal oficial con acuse', desc: 'Circulares, avisos y permisos que llegan de verdad. Se acabaron los grupos de WhatsApp y los \"no me enteré\".', points: ['Acuse de lectura por cada comunicado', 'Permisos firmados desde el celular', 'Segmenta por grupo, grado o toda la escuela'], mockLabel: '98% acuse', mockRows: [['Junta de padres · });\n      this._root.querySelectorAll('[data-reveal]').forEach((el) => io.observe(el));\n\n      const cio = new IntersectionObserver((entries) => {\n        entries.forEach((e) => { if (e.isIntersecting) { this.animateCount(e.target); cio.unobserve(e.target); } });\n      }, { threshold: 0.6 });\n      this._root.querySelectorAll('[data-count]').forEach((el) => cio.observe(el));\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n  }\n\n  animateCount(el) {\n    const target = parseFloat(el.getAttribute('data-count'));\n    const suffix = el.getAttribute('data-suffix') || '';\n    const dur = 1500, start = performance.now();\n    const step = (now) => {\n      const pr = Math.min((now - start) / dur, 1);\n      const eased = 1 - Math.pow(1 - pr, 3);\n      el.textContent = Math.round(target * eased).toLocaleString('es-MX') + suffix;\n      if (pr < 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  }\n\n  renderVals() {\n    const scrolled = this.state.scrolled;\n    const navStyle = 'position:fixed; top:0; left:0; right:0; height:74px; z-index:60; transition:all .35s ease; ' +\n      (scrolled ? 'background:rgba(244,244,242,.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 1px 0 rgba(42,42,42,.08);' : 'background:transparent;');\n    const navInk = scrolled ? '#2A2A2A' : '#ffffff';\n\n    const modules = this.MODULES.map((m, i) => {\n      const active = i === this.state.activeModule;\n      const num = String(i + 1).padStart(2, '0');\n      const rowStyle = 'width:100%; display:flex; align-items:center; gap:14px; padding:20px 24px; background:' + (active ? '#2A2A2A' : 'transparent') + '; border:none; border-bottom:1px solid rgba(42,42,42,.1); cursor:pointer; text-align:left; transition:background .25s ease;';\n      const mockEl = React.createElement(React.Fragment, null, m.mockRows.map((r) =>\n        React.createElement('div', { key: r[0], style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: '#fff', border: '1px solid rgba(42,42,42,.08)', borderRadius: '10px', padding: '11px 14px' } },\n          React.createElement('span', { style: { fontSize: '12.5px', color: '#3A362E', fontWeight: 500 } }, r[0]),\n          React.createElement('span', { style: { fontSize: '12.5px', color: '#2A2A2A', fontWeight: 700, fontFamily: \"'Space Grotesk',sans-serif\" } }, r[1])\n        )\n      ));\n      return {\n        ...m, active, num,\n        numColor: active ? '#8FA38C' : '#9A958A',\n        txtColor: active ? '#ffffff' : '#2A2A2A',\n        dotStyle: 'margin-left:auto; width:8px; height:8px; border-radius:50%; background:' + (active ? '#8FA38C' : 'transparent') + ';',\n        rowStyle, mockEl,\n        select: () => this.setState({ activeModule: i })\n      };\n    });\n    const mod = modules[this.state.activeModule];\n\n    const yes = React.createElement('span', { style: { width: '24px', height: '24px', borderRadius: '50%', background: '#2A2A2A', display: 'flex', alignItems: 'center', justifyContent: 'center' } },\n      React.createElement('svg', { width: 13, height: 13, viewBox: '0 0 24 24', fill: 'none', stroke: '#fff', strokeWidth: 3, strokeLinecap: 'round', strokeLinejoin: 'round' }, React.createElement('path', { d: 'M20 6 9 17l-5-5' })));\n    const no = React.createElement('span', { style: { color: '#C4BFB4', fontSize: '20px', fontWeight: 300, lineHeight: 1 } }, '—');\n    const basic = React.createElement('span', { style: { fontFamily: \"'Space Grotesk',sans-serif\", fontSize: '12px', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.04em', color: '#C4BFB4' } }, 'Básico');\n\n    const cmp = [\n      ['Onboarding 100% autoservicio', yes, no, no],\n      ['Colegiaturas en línea', yes, basic, no],\n      ['Facturación CFDI 4.0', yes, basic, no],\n      ['Portal de padres tipo app', yes, no, basic],\n      ['Comunicados con acuse de lectura', yes, no, no],\n      ['Asistente con IA en español', yes, no, no],\n      ['Precios públicos, sin cotización', yes, no, no]\n    ];\n    const compareRows = cmp.map((r) => ({ label: r[0], us: r[1], a: r[2], b: r[3] }));\n\n    const faqs = this.FAQS.map((f, i) => {\n      const open = i === this.state.openFaq;\n      return {\n        ...f, open,\n        iconStyle: 'flex-shrink:0; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:' + (open ? '#2A2A2A' : 'transparent') + '; color:' + (open ? '#fff' : '#2A2A2A') + '; border:1px solid #2A2A2A; transition:all .3s ease; transform:rotate(' + (open ? '45deg' : '0deg') + ');',\n        bodyStyle: 'overflow:hidden; transition:max-height .38s ease, opacity .3s ease; max-height:' + (open ? '280px' : '0') + '; opacity:' + (open ? '1' : '0') + ';',\n        toggle: () => this.setState({ openFaq: this.state.openFaq === i ? -1 : i })\n      };\n    });\n\n    return {\n      navStyle, navInk,\n      rootRef: (el) => { this._root = el; },\n      heroImgRef: (el) => { this._heroImg = el; },\n      modules, mod, compareRows, faqs\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
