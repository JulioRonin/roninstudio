<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:repeat({{ n }},minmax({{ min }}px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px">
<sc-for list="{{ cols }}" as="c" hint-placeholder-count="5">
<div onDragOver="{{ c.over }}" onDrop="{{ c.drop }}" style="background:rgba(22,26,33,0.5);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(238,235,228,0.09);box-shadow:inset 0 1px 0 rgba(238,235,228,0.08);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:{{ minH }}px;border-color:{{ c.edge }};transition:border-color .2s">
<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px"><span style="display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#7C8088;color:#EEEBE4"><span style="width:6px;height:6px;border-radius:50%;background:{{ c.dot }};box-shadow:0 0 8px {{ c.dot }}"></span>{{ c.t }}</span><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#7C8088">{{ c.count }}</span></div>
<sc-for list="{{ c.cards }}" as="k" hint-placeholder-count="2">
<div draggable="true" onDragStart="{{ k.drag }}" style="background:rgba(12,15,20,0.55);border:1px solid {{ k.border }};box-shadow:{{ k.glow }};border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:grab;transition:transform .2s,border-color .2s" style-hover="transform:translateY(-2px);border-color:#5B6068">
<sc-if value="{{ k.tag }}" hint-placeholder-val="{{ false }}"><div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#7C8088;font-size:9.5px">{{ k.tag }}</div></sc-if>
<div style="font-size:13.5px;line-height:1.3;text-wrap:pretty">{{ k.t }}</div>
<sc-if value="{{ k.s }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;color:#A9A6A0;line-height:1.35;text-wrap:pretty">{{ k.s }}</div></sc-if>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px">
<span style="display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.12em;color:#EEEBE4"><span style="width:6px;height:6px;border-radius:50%;background:{{ k.dot }};box-shadow:0 0 8px {{ k.dot }}"></span>{{ k.chip }}</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:{{ k.mc }};white-space:nowrap">{{ k.m }}</span>
</div>
</div>
</sc-for>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1300,&quot;height&quot;:420},&quot;columns&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;array&quot;},&quot;minCol&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:170,&quot;tsType&quot;:&quot;number&quot;},&quot;minH&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:300,&quot;tsType&quot;:&quot;number&quot;},&quot;onMove&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;}}">
const COL={ox:'#B05139',ol:'#4C8141',am:'#C98A3C',ni:'#A9A6A0',te:'#7C8088',pa:'#EEEBE4',ac:'#5B6068'};
const col=c=>c?(COL[c]||c):null;
class Component extends DCLogic {
  state={cols:null,over:null};
  move(ci){const s=this.src;this.src=null;this.setState({over:null});if(!s||s[0]===ci)return;
    const cols=JSON.parse(JSON.stringify(this.state.cols||this.props.columns||[]));const [card]=cols[s[0]].cards.splice(s[1],1);cols[ci].cards.unshift(card);
    this.setState({cols});if(this.props.onMove)this.props.onMove(card,cols[ci].t);}
  renderVals(){
    const cols=this.state.cols||this.props.columns||[];
    const out=cols.map((c,ci)=>({t:c.t,dot:col(c.dot)||'#5B6068',count:c.cards.length,edge:this.state.over===ci?'rgba(238,235,228,0.4)':'rgba(238,235,228,0.09)',
      over:e=>{e.preventDefault();if(this.state.over!==ci)this.setState({over:ci});},
      drop:e=>{e.preventDefault();this.move(ci);},
      cards:c.cards.map((k,ki)=>({t:k.t,s:k.s||null,tag:k.tag||null,m:k.m||'',mc:k.late?'#EEEBE4':'#7C8088',dot:col(k.dot)||'#7C8088',chip:k.chip||'',
        border:k.late?'#B05139':'rgba(238,235,228,0.08)',glow:k.late?'0 0 22px rgba(176,81,57,0.3)':'none',
        drag:e=>{e.dataTransfer.setData('text/plain','card');this.src=[ci,ki];}}))}));
    return {cols:out,n:cols.length,min:this.props.minCol||170,minH:this.props.minH||300};
  }
}
</script>
</body>
</html>
